# Railway: build bằng Dockerfile, healthcheck /health.
# PORT do Railway cấp, CMD trong Dockerfile đọc ${PORT}.
# Secret (AGENT_API_KEY) và REDIS_URL đặt trên dashboard / `railway variables`, không ghi ở đây.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
